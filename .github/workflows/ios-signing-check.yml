name: iOS signing check (temporary)

on:
  push:
    branches:
      - ci/ios-match-signing

jobs:
  check:
    runs-on: [self-hosted, macOS]
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.2.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
      - run: flutter pub get
      - name: Generate signing keychain password
        run: |
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          echo "SIGNING_KEYCHAIN_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Decode API Key
        run: echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ios/AuthKey.p8
      - name: Install signing certificate and profiles
        run: fastlane ios signing key_id:"${{ env.KEY_ID }}" issuer_id:"${{ env.ISSUER_ID }}"
        working-directory: ./ios
        env:
          APP_STORE_CONNECT_BUNDLE_IDENTIFIER: '${{ secrets.APP_STORE_CONNECT_BUNDLE_IDENTIFIER }}'
          DEVELOPER_PORTAL_TEAM_ID: '${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}'
          KEY_ID: '${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}'
          ISSUER_ID: '${{ secrets.APP_STORE_CONNECT_API_API_ISSUER_ID }}'
          MATCH_PASSWORD: '${{ secrets.MATCH_PASSWORD }}'
          MATCH_GIT_PRIVATE_KEY: '${{ secrets.MATCH_GIT_PRIVATE_KEY }}'
          GIT_SSH_COMMAND: 'ssh -o StrictHostKeyChecking=accept-new'
          MATCH_READONLY: 'false'
      - name: Generate NSYSU profiles
        working-directory: ./ios
        env:
          MATCH_PASSWORD: '${{ secrets.MATCH_PASSWORD }}'
          MATCH_GIT_PRIVATE_KEY: '${{ secrets.MATCH_GIT_PRIVATE_KEY }}'
          GIT_SSH_COMMAND: 'ssh -o StrictHostKeyChecking=accept-new'
          KEY_ID: '${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}'
          ISSUER_ID: '${{ secrets.APP_STORE_CONNECT_API_API_ISSUER_ID }}'
        run: |
          jq -n --arg id "$KEY_ID" --arg iss "$ISSUER_ID" --rawfile key AuthKey.p8 '{key_id:$id,issuer_id:$iss,key:$key,in_house:false}' > "$RUNNER_TEMP/api_key.json"
          security create-keychain -p nsysu-tmp nsysu-tmp.keychain
          fastlane run match type:appstore readonly:false app_identifier:"com.nsysu.ap,com.nsysu.ap.CourseAppWidget" \
            git_url:"git@github.com:abc873693/certificates.git" git_branch:ap-ci-2026 git_private_key:"$MATCH_GIT_PRIVATE_KEY" \
            api_key_path:"$RUNNER_TEMP/api_key.json" keychain_name:nsysu-tmp keychain_password:nsysu-tmp
          security delete-keychain nsysu-tmp.keychain
          rm -f "$RUNNER_TEMP/api_key.json"
      - name: Debug codesign
        continue-on-error: true
        run: |
          KC="$HOME/Library/Keychains/ci-signing-db"
          echo "== session"; id; launchctl managername || true
          echo "== keychain info"; security show-keychain-info "$KC" 2>&1
          echo "== wwdr in signing keychain"; security find-certificate -a -c "Worldwide Developer" -Z "$KC" | grep -E 'SHA-1|labl'
          echo "== wwdr in system"; security find-certificate -a -c "Worldwide Developer" -Z /Library/Keychains/System.keychain | grep -E 'SHA-1|labl'
          security find-certificate -c "Apple Distribution" -p "$KC" > "$RUNNER_TEMP/dist.pem"
          echo "== verify-cert"; security verify-cert -c "$RUNNER_TEMP/dist.pem" -p codeSign -v 2>&1 | tail -5
          echo "== verify-cert with keychain"; security verify-cert -c "$RUNNER_TEMP/dist.pem" -k "$KC" -p codeSign -v 2>&1 | tail -5
          echo "== test codesign"; cp /bin/ls "$RUNNER_TEMP/ls-test"
          ID=$(security find-identity -v -p codesigning "$KC" | awk 'NR==1{print $2}')
          codesign -f -s "$ID" --keychain "$KC" -v "$RUNNER_TEMP/ls-test" 2>&1 || true
          echo "== after unlock"; security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$KC"
          codesign -f -s "$ID" --keychain "$KC" -v "$RUNNER_TEMP/ls-test" 2>&1 || true
          echo "== after partition list"; security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$KC" >/dev/null
          codesign -f -s "$ID" --keychain "$KC" -v "$RUNNER_TEMP/ls-test" 2>&1 || true
          echo "== search list + login"; security list-keychains -d user -s "$KC" /Library/Keychains/System.keychain
          codesign -f -s "$ID" -v "$RUNNER_TEMP/ls-test" 2>&1 || true
          echo "== user trust settings"; security dump-trust-settings 2>&1 | head -5; security dump-trust-settings -d 2>&1 | head -5
      - name: Build iOS
        run: |
          security list-keychains -d user
          security default-keychain -d user
          security find-identity -v -p codesigning
          security find-certificate -a -c 'Apple Distribution' -p "$HOME/Library/Keychains/ci-signing-db" | openssl x509 -noout -subject -issuer || true
          set -o pipefail
          flutter build ipa -v --release --build-number=1 --export-options-plist=ios/ExportOptions.plist 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -5 || { grep -B5 -A25 -E 'CodeSign|errSec|codesign' "$RUNNER_TEMP/build.log" | tail -120; exit 1; }
      - name: Verify signature
        run: |
          whoami
          ls -la build/ios/ipa
          cd build/ios/ipa && unzip -q -o *.ipa -d extracted
          codesign -dvv extracted/Payload/Runner.app 2>&1 | grep -E "Authority|TeamIdentifier"
          codesign -dvv extracted/Payload/Runner.app/PlugIns/*.appex 2>&1 | grep -E "Authority|Identifier"
      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/ci-signing-db" 2>/dev/null || true
          security delete-keychain nsysu-tmp.keychain 2>/dev/null || true
          rm -f ios/AuthKey.p8
